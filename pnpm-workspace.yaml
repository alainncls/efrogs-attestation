packages:
  - packages/*

catalogs:
  eslint:
    '@eslint/js': 10.0.1
    eslint: 10.13.0
    globals: 17.13.0
    typescript-eslint: 8.71.2
  eslint-react:
    eslint-plugin-react-hooks: 7.1.1
    eslint-plugin-react-refresh: 0.5.7
  hardhat:
    '@nomicfoundation/hardhat-verify': 3.1.3
    '@nomicfoundation/hardhat-viem': 3.0.10
    hardhat: 3.20.0
    solhint: 6.2.5
  openzeppelin:
    '@openzeppelin/contracts': 5.6.1
    '@openzeppelin/contracts-upgradeable': 5.6.1
  prettier:
    prettier: 3.9.10
    prettier-plugin-solidity: 2.4.1
  react:
    '@tanstack/react-query': 5.104.4
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    react: 19.3.1
    react-dom: 19.3.1
  typescript:
    '@types/node': 24.19.2
    typescript: 6.0.3
  verax:
    '@verax-attestation-registry/verax-contracts': 10.0.0
    '@verax-attestation-registry/verax-sdk': 5.4.0
  vite:
    '@vitejs/plugin-react': 6.1.2
    vite: 8.3.4
  wagmi:
    '@reown/appkit': 1.8.24
    '@reown/appkit-adapter-wagmi': 1.8.24
    '@wagmi/core': 3.6.5
    wagmi: 3.7.7
  web3:
    viem: 2.57.7

overrides:
  # GHSA-mrhx-c7xc-m3w5 / CVE-2023-54404: Reown AppKit 1.8.24 still pins
  # Zod 3.x, which is affected. Zod 4.6.6 is the first patched release.
  # Keep this explicit until Reown releases a compatible dependency graph.
  zod: 4.6.6
  '@graphql-tools/utils': 12.0.3
  axios: 1.20.0
  '@fastify/busboy': 3.2.2
  '@graphql-tools/executor-legacy-ws': 1.1.37
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  # GHSA-mrwp-f3q8-3g9p: axios' allowed range still resolves vulnerable
  # follow-redirects 1.16.1 through the AppKit and Verax dependency graph.
  follow-redirects: 1.16.2
  adm-zip@<0.6.1: 0.6.1
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  fast-uri@>=2.0.0 <2.4.8: 2.4.8
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  undici@7.30.0: 7.30.1
  viem>ws: 8.21.3
  '@base-org/account': 2.5.13
  '@walletconnect/ethereum-provider': 2.26.0
  '@reown/appkit-adapter-wagmi>@wagmi/connectors': 8.2.0
